<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPED Compensatory Services</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>SPED Compensatory Services</h1>
      <p id="welcomeMessage"></p>
    </div>

    <div class="header-actions">
      <button id="addStudentButton" class="secondary-button hidden" type="button">Add Student</button>
      <button id="importStudentsButton" class="secondary-button hidden" type="button">Import Students</button>
      <button id="downloadTemplateButton" class="secondary-button hidden" type="button">CSV Template</button>
      <input id="studentCsvInput" class="hidden" type="file" accept=".csv,text/csv">
      <button id="exportButton" class="secondary-button" type="button">Export CSV</button>
      <button id="logoutButton" class="danger-button" type="button">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="summary-grid">
      <article class="summary-card"><span id="studentCountLabel">Students</span><strong id="studentCount">0</strong></article>
      <article class="summary-card"><span>Assigned Hours</span><strong id="assignedHours">0.00</strong></article>
      <article class="summary-card"><span id="completedLabel">Completed Hours</span><strong id="completedHours">0.00</strong></article>
      <article class="summary-card"><span id="remainingLabel">Hours Left</span><strong id="remainingHours">0.00</strong></article>
    </section>

    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="Search student ID, name, school, or grade">
      <select id="schoolFilter"><option value="">All Schools</option></select>
      <div class="toolbar-buttons">
        <button id="expandAllButton" class="secondary-button" type="button">Expand All</button>
        <button id="collapseAllButton" class="secondary-button" type="button">Collapse All</button>
        <button id="refreshButton" class="secondary-button" type="button">Refresh</button>
      </div>
    </section>

    <section id="studentList" class="student-list"></section>
    <p id="appMessage" class="message"></p>
  </main>

  <div id="studentModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="studentModalTitle">Add Student</h2>
        <button class="close-button" type="button" data-close="studentModal">&times;</button>
      </div>

      <input id="studentRecordId" type="hidden">

      <div class="form-grid">
        <div><label for="studentId">Student ID</label><input id="studentId" type="text"></div>
        <div><label for="firstName">First Name</label><input id="firstName" type="text"></div>
        <div><label for="lastName">Last Name</label><input id="lastName" type="text"></div>
        <div><label for="school">School</label><input id="school" type="text"></div>
        <div><label for="grade">Grade</label><input id="grade" type="text"></div>
        <div><label for="compHours">Compensatory Hours</label><input id="compHours" type="number" min="0" step="0.25"></div>
        <div>
          <label for="assignedProvider">Assigned Provider</label>
          <select id="assignedProvider">
            <option value="">Select Provider</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button class="secondary-button" type="button" data-close="studentModal">Cancel</button>
        <button id="saveStudentButton" class="primary-button" type="button">Save Student</button>
      </div>
      <p id="studentMessage" class="message"></p>
    </div>
  </div>

  <div id="serviceModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Add Service Session</h2>
        <button class="close-button" type="button" data-close="serviceModal">&times;</button>
      </div>

      <input id="serviceStudentId" type="hidden">
      <div id="serviceStudentName" class="student-highlight"></div>

      <div class="form-grid">
        <div><label for="serviceDate">Date</label><input id="serviceDate" type="date"></div>
        <div><label for="startTime">Start Time</label><input id="startTime" type="time"></div>
        <div><label for="endTime">End Time</label><input id="endTime" type="time"></div>
        <div class="full-width"><label for="serviceNotes">Notes <span class="required-mark">*</span></label><textarea id="serviceNotes" rows="4" placeholder="Enter required service notes" required></textarea></div>
      </div>

      <div class="modal-actions">
        <button class="secondary-button" type="button" data-close="serviceModal">Cancel</button>
        <button id="saveServiceButton" class="primary-button" type="button">Save Session</button>
      </div>
      <p id="serviceMessage" class="message"></p>
    </div>
  </div>

  <div id="importModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Student Import Results</h2>
        <button class="close-button" type="button" data-close="importModal">&times;</button>
      </div>
      <div id="importResults" class="import-results"></div>
      <div class="modal-actions">
        <button class="primary-button" type="button" data-close="importModal">Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
